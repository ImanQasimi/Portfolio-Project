<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume — Iman Qasimi</title>
<meta name="description" content="Download or view Iman Qasimi's resume.">

<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
</script>
  
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Internal CSS -->
<style>
  .resume-hero { padding: 3rem 0 1.5rem; text-align: center; }
  .resume-frame-wrap {
    max-width: 760px;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg-elev);
  }
  .resume-frame-bar {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.6rem 0.9rem;
    background: var(--bg-elev-2);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);
  }
  .resume-frame { width: 100%; height: 800px; border: none; display: block; background: #fff; }
  .resume-actions { display: flex; justify-content: center; gap: 1rem; margin: 1.5rem 0 3rem; flex-wrap: wrap; }
</style>
</head>
<body>

<header class="site-header">
  <div class="editor-titlebar">
    <span class="dots"><span></span><span></span><span></span></span>
    <span>Iman Qasimi — portfolio — resume.html</span>
  </div>
  <!-- Nav markup lives in components/header.html and is injected here by js/components.js -->
  <nav class="navbar" aria-label="Primary" id="nav-placeholder"></nav>
</header>
  
<main>
  <section class="resume-hero">
    <div class="wrap">
      <p class="eyebrow">resume</p>
      <h1>My Resume</h1>
      <p style="max-width: 50ch; margin: 1rem auto 0;">
        A quick look at my education, skills, and experience. Prefer a PDF?
        Grab a copy with the button below.
      </p>
    </div>
  </section>


  <div class="resume-frame-wrap">
    <div class="resume-frame-bar">
      <span class="dots"><span></span><span></span><span></span></span>
      <span>resume.pdf</span>
    </div>
    <iframe
      class="resume-frame"
      src="assets/Resume.pdf"
      title="Iman Qasimi resume preview">
      Your browser doesn't support embedded PDFs.
      <a href="assets/Resume.pdf">Download the resume instead</a>.
    </iframe>
  </div>

  <div class="resume-actions">
    <a href="assets/resume.pdf" download class="btn btn-primary">⬇ Download Resume (PDF)</a>
    <a href="contact.html" class="btn btn-ghost">Get in Touch</a>
  </div>
</main>

<footer class="site-footer">
  <!-- Footer markup lives in components/footer.html and is injected here by js/components.js -->
  <div class="wrap footer-inner" id="footer-placeholder"></div>
</footer>

<script src="js/theme.js"></script>
<script src="js/components.js"></script>

</body>
</html>
