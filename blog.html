<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Iman Qasimi</title>
<meta name="description" content="Notes and write-ups from Iman Qasimi on building this site and other web projects.">

<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
</script>
  
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Internal CSS: -->
<style>
  .blog-hero { padding: 3rem 0 1rem; }
  .blog-filter-bar {
    display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
    margin: 1.5rem 0 2.5rem;
  }
  .blog-filter-bar input {
    flex: 1; min-width: 220px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.7rem 1rem;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }
  .post-card { margin-bottom: 1.5rem; }
  .post-meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.5rem; }
  .post-meta .category { color: var(--accent-3); }
  .post-summary, .post-full-content { margin-bottom: 0.75rem; }
  .read-more-btn {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--accent-3);
    padding: 0.4rem 0.9rem;
    cursor: pointer;
  }
  .read-more-btn:hover { border-color: var(--accent-3); background: var(--bg-elev-2); }
  
</style>
</head>
<body>

<header class="site-header">
  <div class="editor-titlebar">
    <span class="dots"><span></span><span></span><span></span></span>
    <span>iman-qasimi — portfolio — blog.html</span>
  </div>
  <!-- Nav markup lives in components/header.html and is injected here by js/components.js -->
  <nav class="navbar" aria-label="Primary" id="nav-placeholder"></nav>
</header>

<main>
  <section class="blog-hero">
    <div class="wrap">
      <p class="eyebrow">blog</p>
      <h1>Notes from the build log</h1>
      <p style="max-width: 55ch; margin-top: 1rem;">
        Write-ups on how I built different parts of this site, what I learned,
        and what I'd do differently next time.
      </p>

      <!-- Phase 2 -->
      <div class="blog-filter-bar">
        <input type="search" id="filter-input" placeholder="Search posts by title or category…" aria-label="Search posts">
      </div>

      <!--
        Phase 2 
      -->
      <div id="blog-list">
        <article class="card post-card">
          <p class="post-meta"><span class="category">Tutorial</span> · Placeholder date</p>
          <h3 class="card-title">Example Post Title<span class="badge-latest">Latest</span></h3>
          <p>Loading posts…</p>
        </article>
      </div>

      <p id="no-results" style="display:none; text-align:center; color: var(--text-muted); font-family: var(--font-mono); padding: 2rem 0;">
        No posts match your search.
      </p>

    </div>
  </section>
</main>

<footer class="site-footer">
  <!-- Footer markup lives in components/footer.html and is injected here by js/components.js -->
  <div class="wrap footer-inner" id="footer-placeholder"></div>
</footer>

<script src="js/theme.js"></script>
<script src="js/components.js"></script>
<script src="js/blog.js"></script>
  
</body>
</html>
